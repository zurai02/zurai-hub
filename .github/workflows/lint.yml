name: Lint

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          python3 - << 'EOF'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.json"):
              if ".git" in p.parts:
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("All JSON files are valid.")
          EOF

  luau:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install luacheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luarocks && sudo luarocks install luacheck

      - name: Run luacheck on top-level Scr scripts
        # Non-blocking for now: Roblox scripts use many engine globals and
        # existing code has not been cleaned up yet.
        continue-on-error: true
        run: luacheck Scr/*.lua Scr/*.luau
