name: Inject Panel to Scripts

on:
  push:
    branches:
      - main
    paths:
      - 'Scr/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inject-panel-scripts
  cancel-in-progress: false

jobs:
