              exit(0)

          for root, dirs, files in os.walk(dir_path):
              for file in files:
                  if file.endswith(".luau"):
                      file_path = os.path.join(root, file)
                      if file == "load string.luau":
                          continue
                      
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      
                      # Check if panel is already present
                      if panel_code.strip() not in content:
                          new_content = panel_code + "\n\n" + content
                          with open(file_path, "w", encoding="utf-8") as f:
                              f.write(new_content)
                          print(f"Injected panel into: {file_path}")

          EOF

      - name: Commit and push changes with retry
        run: |
          for i in {1..5}; do
            git pull origin main --rebase --autostash
            git add .
            git diff --cached --quiet || git commit -m "chore: inject art panel to script headers [skip ci]"
            if git push origin main; then
              echo "Successfully pushed changes."
              exit 0
            fi
            echo "Push failed (attempt $i/5), retrying in 3 seconds..."
            sleep 3
          done
          echo "Error: Failed to push after multiple attempts."
          exit 1
