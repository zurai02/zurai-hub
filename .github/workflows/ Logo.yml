          for i in {1..5}; do
              git fetch origin main
              git reset --mixed origin/main
              rm -f games.json
              
              python3 - << EOF
          import os, json, urllib.request, time

          target_dir = "Scr/games"
          games_map = {}
          banner = """$BANNER"""

          if os.path.exists(target_dir):
              for file in os.listdir(target_dir):
                  if file.endswith((".lua", ".luau")):
                      path = os.path.join(target_dir, file)
                      
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                      
                      # Strip any existing banner to avoid duplication
                      if "--[===========================================================[" in content:
                          parts = content.split("--]===========================================================]")
                          if len(parts) > 1:
                              content = parts[1].lstrip()
                      
                      if not content.startswith(banner):
                          new_content = banner + "\n\n" + content
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(new_content)

                      name = os.path.splitext(file)[0]
                      rel_path = path.replace("\\", "/")
                      entry = {"name": "Universal", "path": rel_path}
                      
                      if name.isdigit():
                          try:
                              req = urllib.request.Request(f"https://apis.roproxy.com/universes/v1/places/{name}/universe", headers={"User-Agent": "Mozilla/5.0"})
                              with urllib.request.urlopen(req, timeout=5) as res:
                                  universe_id = json.loads(res.read().decode()).get("universeId")
                              
                              if universe_id:
                                  req2 = urllib.request.Request(f"https://games.roproxy.com/v1/games?universeIds={universe_id}", headers={"User-Agent": "Mozilla/5.0"})
                                  with urllib.request.urlopen(req2, timeout=5) as res2:
                                      data = json.loads(res2.read().decode())
                                      if data.get("data"):
                                          entry["name"] = data["data"][0].get("name", "Unknown Game")
                          except Exception:
                              pass
                              
                      games_map[name] = entry

          output = {
              "timestamp": int(time.time()),
              "games": games_map
          }

          os.makedirs("Scr", exist_ok=True)
          with open("Scr/games.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=4)
          EOF

              git add Scr/games.json Scr/games/
              if git diff --cached --quiet; then
                  echo "No changes to manifest or scripts."
                  exit 0
              fi
              
              git commit -m "chore: inject banner and update Scr/games.json manifest [skip ci]"
              
              if git push origin main; then
                  echo "Successfully pushed!"
                  exit 0
              fi
              
              echo "Push rejected due to race condition, retrying ($i/5)..."
              sleep 4
          done
          exit 1
