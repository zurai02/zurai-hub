name: Update Games Registry

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Scr/games/**/*.lua'
      - 'Scr/games/**/*.luau'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: update-games-registry
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Commit and Push with Robust Rebase Retry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for i in {1..5}; do
            git fetch origin main
            git reset --mixed origin/main
            rm -f Scr/games.json

            python3 - << 'EOF'
          import os, json, re, sys, time, urllib.request

          TARGET_DIR = "Scr/games"
          OUT_FILE = "Scr/games.json"
          UA = {"User-Agent": "Mozilla/5.0"}

          def fetch_json(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=10) as res:
                  return json.loads(res.read().decode())

          def name_from_filename(stem):
              # "anti-afk" -> "Anti Afk", "Conter-brainrot-police" -> "Conter Brainrot Police"
              words = re.split(r"[-_\s]+", stem.strip())
              return " ".join(w.capitalize() for w in words if w) or stem

          def lookup_place_name(place_id):
              # 1) Official Roblox API: place -> universe -> game name
              try:
                  uid = fetch_json(f"https://apis.roblox.com/universes/v1/places/{place_id}/universe").get("universeId")
                  if uid:
                      data = fetch_json(f"https://games.roblox.com/v1/games?universeIds={uid}").get("data") or []
                      if data and data[0].get("name"):
                          return data[0]["name"]
              except Exception as e:
                  print(f"roblox lookup failed for {place_id}: {e}", file=sys.stderr)

              # 2) Fallback: ropro mirror
              try:
                  uid = fetch_json(f"https://apis.ropro.io/universes/v1/places/{place_id}/universe").get("universeId")
                  if uid:
                      data = fetch_json(f"https://games.ropro.io/v1/games?universeIds={uid}").get("data") or []
                      if data and data[0].get("name"):
                          return data[0]["name"]
              except Exception as e:
                  print(f"ropro lookup failed for {place_id}: {e}", file=sys.stderr)

              return f"Place {place_id}"

          games_map = {}
          if os.path.isdir(TARGET_DIR):
              for file in sorted(os.listdir(TARGET_DIR)):
                  if not file.endswith((".lua", ".luau")):
                      continue
                  stem = os.path.splitext(file)[0]
                  path = f"{TARGET_DIR}/{file}"
                  if stem.isdigit():
                      name = lookup_place_name(stem)
                      time.sleep(0.2)  # be polite to the APIs
                  else:
                      name = name_from_filename(stem)
                  games_map[stem] = {"name": name, "path": path}

          output = {
              "timestamp": int(time.time()),
              "games": games_map
          }

          os.makedirs(os.path.dirname(OUT_FILE), exist_ok=True)
          with open(OUT_FILE, "w", encoding="utf-8") as f:
              json.dump(output, f, indent=4, ensure_ascii=False)
          print(f"Wrote {len(games_map)} entries to {OUT_FILE}")
          EOF

            python3 - << 'EOF'
          import json, os, sys
          data = json.load(open("Scr/games.json", encoding="utf-8"))
          games = data.get("games", {})
          if not games:
              sys.exit("Manifest has no entries; refusing to commit an empty registry.")
          missing = [g["path"] for g in games.values() if not os.path.exists(g["path"])]
          if missing:
              sys.exit(f"Manifest points at missing files: {missing[:5]}")
          print(f"Validated {len(games)} entries.")
          EOF

            git add Scr/games.json
            if git diff --cached --quiet; then
              echo "No changes to manifest."
              exit 0
            fi

            git commit -m "chore: update Scr/games.json manifest [skip ci]"

            if git push origin main; then
              echo "Successfully pushed!"
              exit 0
            fi

            echo "Push rejected due to race condition, retrying ($i/5)..."
            sleep 4
          done
          exit 1
