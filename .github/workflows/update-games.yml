name: Update Games Registry

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: update-games-registry
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Commit and Push with Robust Rebase Retry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          for i in {1..5}; do
            git fetch origin main
            git reset --mixed origin/main
            rm -f Scr/games.json
            
            python3 - << 'EOF'
          import os, json, urllib.request, time

          target_dir = "Scr/games"
          games_map = {}

          if os.path.exists(target_dir):
              for file in os.listdir(target_dir):
                  if file.endswith((".lua", ".luau")):
                      name = os.path.splitext(file)[0]
                      path = os.path.join(target_dir, file).replace("\\", "/")
                      entry = {"name": "Universal", "path": path}
                      
                      if name.isdigit():
                          try:
                              req = urllib.request.Request(f"https://apis.ropro.io/universes/v1/places/{name}/universe", headers={"User-Agent": "Mozilla/5.0"})
                              with urllib.request.urlopen(req, timeout=5) as res:
                                  universe_id = json.loads(res.read().decode()).get("universeId")
                              
                              if universe_id:
                                  req2 = urllib.request.Request(f"https://games.ropro.io/v1/games?universeIds={universe_id}", headers={"User-Agent": "Mozilla/5.0"})
                                  with urllib.request.urlopen(req2, timeout=5) as res2:
                                      data = json.loads(res2.read().decode())
                                      if data.get("data"):
                                          entry["name"] = data["data"][0].get("name", "Unknown Game")
                          except Exception:
                              pass
                              
                      games_map[name] = entry

          output = {
              "timestamp": int(time.time()),
              "games": games_map
          }

          os.makedirs("Scr", exist_ok=True)
          with open("Scr/games.json", "w", encoding="utf-8") as f:
              json.dump(output, f, indent=4)
          EOF

              git add Scr/games.json
              if git diff --cached --quiet; then
                  echo "No changes to manifest."
                  exit 0
              fi
              
              git commit -m "chore: update Scr/games.json manifest [skip ci]"
              
              if git push origin main; then
                  echo "Successfully pushed!"
                  exit 0
              fi
              
              echo "Push rejected due to race condition, retrying ($i/5)..."
              sleep 4
          done
          exit 1
