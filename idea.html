<title>Zurai Hub — Ideas</title>
<link rel="stylesheet" href="style.css">

<style>
  /* Idea-specific: kanban-like status rows */
  .idea-list { display: flex; flex-direction: column; gap: 10px; }

  .idea-item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: start;
    gap: 14px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color .18s;
  }

  .idea-item:hover { border-color: var(--border2); }

  .idea-num {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--fg3);
    padding-top: 2px;
    font-variant-numeric: tabular-nums;
    min-width: 22px;
  }

  .idea-body h3 {
    font-family: var(--font-display);
    font-size: .98rem;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: .03em;
    margin-bottom: 3px;
  }

  .idea-body p {
    font-size: .82rem;
    color: var(--fg2);
    line-height: 1.5;
  }

  .idea-status { padding-top: 2px; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .filter-btn {
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 3px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--fg3);
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }

  .filter-btn:hover,
  .filter-btn.active {
    color: var(--acc2);
    border-color: var(--acc);
    background: var(--bg3);
  }
</style>

<nav>
  <div class="nav">
    <a class="nav-logo" href="loader.html">ZURAI<span>HUB</span></a>
    <ul class="nav-links">
      <li><a href="loader.html">Loader</a></li>
      <li><a href="api.html">API</a></li>
      <li><a href="idea.html" class="active">Ideas</a></li>
    </ul>
  </div>
</nav>

<main class="page">

  <section style="margin-bottom:36px">
    <div class="hero-badge">Feature Roadmap</div>
    <h1 style="font-family:var(--font-display);font-size:clamp(1.8rem,5vw,2.8rem);font-weight:700;letter-spacing:.02em;margin-bottom:12px">
      Idea <span style="color:var(--acc2)">Board</span>
    </h1>
    <p style="color:var(--fg2);max-width:560px;margin-bottom:22px">
      Planned features, active development items, and community suggestions for
      Zurai Hub v3.x. Status reflects the current build at <span style="color:var(--acc3);font-family:var(--font-mono)">v3.3.0</span>.
    </p>
    <span id="envBadge" class="chip chip-purple">DETECTING ENV…</span>
  </section>

  <!-- Stats -->
  <div class="stats-row" style="margin-block:0 36px">
    <div class="stat-cell">
      <div class="stat-num" id="doneCount">—</div>
      <div class="stat-label">Shipped</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="wipCount">—</div>
      <div class="stat-label">In Progress</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="todoCount">—</div>
      <div class="stat-label">Planned</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="totalCount">—</div>
      <div class="stat-label">Total</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="shipped">Shipped</button>
    <button class="filter-btn" data-filter="wip">In Progress</button>
    <button class="filter-btn" data-filter="planned">Planned</button>
  </div>

  <!-- Ideas list -->
  <div class="idea-list" id="ideaList"></div>

</main>

<footer class="footer">
  <span class="footer-copy">© 2026 ZURAI HUB · v3.3.0</span>
  <span class="ver-tag">STABLE</span>
</footer>

<script src="ap.js"></script>
<script>
const IDEAS = [
  // ── Shipped ──────────────────────────────────────────────────────────────
  { status:'shipped', title:'XChaCha20-style keystream encryption',     desc:'xorshift32 PRNG, SBox/ISBox tables, per-URL byte-array constants, ICH_VAL integrity guard.' },
  { status:'shipped', title:'52-opcode Luau VM with 5-pass optimiser',  desc:'cfold, dce, peep, jthread, inline_moves. ABx/AsBx/ABC encoding. repeat…until dispatch loop.' },
  { status:'shipped', title:'CALL B==1 zero-arg fast-path',             desc:'Eliminates args table allocation when a function is called with no arguments.' },
  { status:'shipped', title:'Exponential backoff + jitter in Net.get',  desc:'Initial 0.3 s, doubles per retry, capped at 8 s, ±100 ms jitter; 4 retries total.' },
  { status:'shipped', title:'fDone race guard in fetchBatch',           desc:'First successful parallel fetch sets fDone; remaining workers abort early.' },
  { status:'shipped', title:'24-signature executor fingerprinting',     desc:'Covers syn, krnl, fluxus, oxygen, electron, wave, proto, xeno, Drawing, Synapse and more.' },
  { status:'shipped', title:'_antiTamper() boot check',                 desc:'Detects meta-hook injection on _G, hookfunction API presence, and excess DescendantAdded connections.' },
  { status:'shipped', title:'5-particle orbital loader UI',             desc:'Sine-oscillator orbits, per-particle color (acc/acc2/acc3/mint/gold), transparency pulse.' },
  { status:'shipped', title:'Animated status ellipsis ticker',          desc:'Status bar dots animate at 0.46 s intervals; matches "ing" and ".." suffixes.' },
  { status:'shipped', title:'Bar completion triple flash',              desc:'BarGlow ImageTransparency pulses 3× when progress reaches ≥ 99.9%.' },

  // ── In Progress ──────────────────────────────────────────────────────────
  { status:'wip', title:'Lua 5.4 upvalue optimiser',                   desc:'Track upvalue read/write counts; inline constants and promote hot upvalues to registers.' },
  { status:'wip', title:'Network response caching (LRU)',               desc:'Bounded LRU cache on the Net layer; TTL-aware eviction for CDN responses.' },
  { status:'wip', title:'GUI tab system',                               desc:'Multi-tab hub UI with per-tab script state, keybind toggle, and drag-handle resizing.' },
  { status:'wip', title:'WebSocket keep-alive channel',                 desc:'Persistent WS to CDN for hot-reload of module updates without re-fetching full source.' },

  // ── Planned ──────────────────────────────────────────────────────────────
  { status:'planned', title:'Bytecode diff patching',                  desc:'Delta-patch VM bytecode from server; only changed ops are transmitted, not full source.' },
  { status:'planned', title:'Module registry',                         desc:'Named module system: require("zurai:esp"), require("zurai:aimbot") with lazy loading.' },
  { status:'planned', title:'WASM JIT back-end experiment',            desc:'Explore compiling hot loops to WASM for native-speed execution inside the executor sandbox.' },
  { status:'planned', title:'Persistent config via datastore proxy',   desc:'Sync user settings across sessions via a lightweight Roblox datastore proxy server.' },
  { status:'planned', title:'Plugin API surface',                      desc:'Allow third-party script authors to register tabs and callbacks against the hub runtime.' },
  { status:'planned', title:'Auto-update notify toast',                desc:'Version-check on boot; show a non-blocking toast when a newer release is available.' },
];

const CHIP = {
  shipped: '<span class="chip chip-green" style="white-space:nowrap">Shipped</span>',
  wip:     '<span class="chip chip-yellow" style="white-space:nowrap">In&nbsp;Progress</span>',
  planned: '<span class="chip chip-purple" style="white-space:nowrap">Planned</span>',
};

function renderList(filter) {
  const list = document.getElementById('ideaList');
  const items = filter === 'all' ? IDEAS : IDEAS.filter(i => i.status === filter);
  list.innerHTML = items.map((idea, idx) => `
    <div class="idea-item" data-status="${idea.status}">
      <div class="idea-num">${String(idx + 1).padStart(2,'0')}</div>
      <div class="idea-body">
        <h3>${idea.title}</h3>
        <p>${idea.desc}</p>
      </div>
      <div class="idea-status">${CHIP[idea.status] || ''}</div>
    </div>
  `).join('');
}

function updateStats() {
  const shipped = IDEAS.filter(i => i.status === 'shipped').length;
  const wip     = IDEAS.filter(i => i.status === 'wip').length;
  const planned = IDEAS.filter(i => i.status === 'planned').length;
  document.getElementById('doneCount').textContent  = shipped;
  document.getElementById('wipCount').textContent   = wip;
  document.getElementById('todoCount').textContent  = planned;
  document.getElementById('totalCount').textContent = IDEAS.length;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderList(btn.dataset.filter);
  });
});

renderList('all');
updateStats();
</script>
